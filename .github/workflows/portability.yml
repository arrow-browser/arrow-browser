# Keeps Arrow's shared code building and tested outside macOS
# (docs/PORTABILITY.md). Every job uses the same Swift release.
name: Portability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arrowkit-linux:
    name: ArrowKit on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.4.1-noble@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7
    defaults:
      run:
        working-directory: Packages/ArrowKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test

  arrowkit-windows:
    name: ArrowKit on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Packages/ArrowKit
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test

  # The CEF bindings, and a window with one browser (cef-shell --smoke), run
  # where the Windows and Linux apps will.
  arrowcef-linux:
    name: ArrowCEF on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swift:6.4.1-noble@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7
      # Chromium's setuid sandbox helper creates namespaces.
      options: --cap-add=SYS_ADMIN
    steps:
      - name: Install CEF's dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bzip2 curl python3 libx11-dev xvfb xauth \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdbus-1-3 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libcairo2 \
            libpango-1.0-0 libasound2t64 libudev1 libexpat1 libglib2.0-0t64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/cef
          key: cef-linux64-${{ hashFiles('scripts/fetch-cef.sh') }}
      - run: scripts/fetch-cef.sh
      - name: Build cef-shell
        working-directory: Packages/ArrowCEF
        run: swift build --product cef-shell
      - name: Open a browser window, sandboxed
        timeout-minutes: 5
        working-directory: Packages/ArrowCEF
        run: |
          bin="$(swift build --show-bin-path)"
          ../../scripts/stage-cef.sh "$bin"
          # Chromium refuses to start without a sandbox: its setuid helper
          # must belong to root, and the browser must not run as root.
          chown root:root "$bin/chrome-sandbox"
          chmod 4755 "$bin/chrome-sandbox"
          useradd --create-home shell
          runuser -u shell -- xvfb-run -a "$bin/cef-shell" --smoke | tee output.txt
          grep -q "sandbox: on" output.txt
      - name: Show Chromium's log
        if: failure()
        run: cat /tmp/arrow-cef-shell/Logs/chromium.log || true

  arrowcef-windows:
    name: ArrowCEF on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/cef
          key: cef-windows64-${{ hashFiles('scripts/fetch-cef.sh') }}
      - run: scripts/fetch-cef.sh
        shell: bash
      - name: Build cef-shell
        working-directory: Packages/ArrowCEF
        run: swift build --product cef-shell
      - name: Open a browser window
        timeout-minutes: 5
        working-directory: Packages/ArrowCEF
        shell: bash
        run: |
          bin="$(cygpath -u "$(swift build --show-bin-path)")"
          ../../scripts/stage-cef.sh "$bin"
          cp Sources/CEFShell/cef-shell.exe.manifest "$bin/"
          "$bin/cef-shell.exe" --smoke
      - name: Build cef-shell as a DLL for CEF's bootstrap
        working-directory: Packages/ArrowCEF
        run: swift build --product cef-shell-sandboxed
      - name: Open a browser window, sandboxed
        timeout-minutes: 5
        working-directory: Packages/ArrowCEF
        shell: bash
        run: |
          bin="$(cygpath -u "$(swift build --show-bin-path)")"
          # CEF's bootstrap loads the DLL named after it and sandboxes it.
          cp ../../Vendor/cef/Release/bootstrapc.exe "$bin/cef-shell-sandboxed.exe"
          # Sandboxed processes do not look for DLLs in PATH: install the
          # Swift runtime next to the executable, as an installer would.
          runtime="$(dirname "$(cygpath -u "$(where.exe swiftCore.dll | head -1 | tr -d '\r')")")"
          cp "$runtime"/*.dll "$bin/"
          "$bin/cef-shell-sandboxed.exe" --smoke | tee output.txt
          grep -q "sandbox: on" output.txt
      - name: Show Chromium's log
        if: failure()
        shell: pwsh
        run: Get-Content "$env:TEMP\arrow-cef-shell\Logs\chromium.log" -ErrorAction SilentlyContinue

  # The Windows app (Windows/): WinUI 3 window with one browser, sandboxed.
  arrow-windows:
    name: Arrow for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/cef
          key: cef-windows64-${{ hashFiles('scripts/fetch-cef.sh') }}
      - run: scripts/fetch-cef.sh
        shell: bash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/.packages
          key: winrt-${{ hashFiles('Windows/projections.json') }}
      - name: Generate the WinRT projections
        run: Windows/generate-winrt.ps1
      - name: Install the Windows App SDK runtime
        run: |
          Get-ChildItem Windows/.packages/Microsoft.WindowsAppSDK.Runtime.*/tools/MSIX/win10-x64/*.msix |
            Sort-Object { $_.Name -ne 'Microsoft.WindowsAppRuntime.2.msix' } |
            ForEach-Object { Add-AppxPackage $_.FullName }
      - name: Build Arrow
        working-directory: Windows
        run: swift build --product Arrow
      - name: Open a browser window, sandboxed
        timeout-minutes: 5
        working-directory: Windows
        run: |
          $bin = swift build --show-bin-path
          ./stage.ps1 -Console $bin
          & "$bin/Arrow.exe" --smoke | Tee-Object output.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Quiet 'sandbox: on' output.txt)) { exit 1 }
      - name: Show Chromium's log
        if: failure()
        run: Get-Content "$env:LOCALAPPDATA/Arrow/Logs/chromium.log" -ErrorAction SilentlyContinue
