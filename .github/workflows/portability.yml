# Keeps Arrow's shared code building and tested outside macOS
# (docs/PORTABILITY.md). Both jobs use the same Swift release.
name: Portability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arrowkit-linux:
    name: ArrowKit on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.4.1-noble@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7
    defaults:
      run:
        working-directory: Packages/ArrowKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test

  arrowkit-windows:
    name: ArrowKit on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Packages/ArrowKit
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Observation smoke test (temporary)
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          @'
          import Observation
          @Observable final class Model { var count = 0 }
          let model = Model()
          withObservationTracking { _ = model.count } onChange: { print("changed") }
          model.count += 1
          '@ | Set-Content main.swift
          swiftc -o obs.exe main.swift
          $out = ./obs.exe
          Write-Output "observation output: $out"
          if ($out -ne 'changed') { exit 1 }
